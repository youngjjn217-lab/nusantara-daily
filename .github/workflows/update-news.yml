name: Update news data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python build_static_data.py news
        env:
          NUSANTARA_GNEWS_API_KEY: ${{ secrets.NUSANTARA_GNEWS_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update news data"
          file_pattern: docs/data/news.json
